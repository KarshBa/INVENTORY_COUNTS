<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open-Scale PLU Finder</title>
  <link rel="stylesheet" href="style.css?v=1.1" />
  <link rel="stylesheet" href="https://item-list-handler.onrender.com/shared/nav.css?v=1.0.0">
  <!-- ✦ extra tweaks specific to this tool ✦ -->
  <style>
    /* base look */
    :root{
      --bg: #faf6ee;
      --page-css-width: 900px;
      --page-gap: 18px;
    }
    body            { font-family: Arial, sans-serif; font-size: 1.1rem; }
    header          { background:#CA1038; color:#fff; text-align:center; padding:1rem 0; }
    h1              { margin:0; font-size:1.8rem; padding:1rem 0; }
	  main            { margin-top: 1.5rem; }
    section {
      margin-top: 1.5rem;
    }

    /* big blue buttons */
    button#refreshBtn,
    button#getBtn   {
      background:#0b63c5;   /* blue */
      color:#fff;
      border:none;
      border-radius:4px;
      padding:.6rem 1.4rem;
      font-size:1rem;
      cursor:pointer;
    }
    button#refreshBtn:hover,
    button#getBtn:hover {
      background:#084a97;   /* darker blue on hover */
    }

    /* ensure secondary buttons elsewhere keep their grey look */
    button.secondary {
      background:#eee;
      color:#000;
    }
    button.secondary:hover {
      background:#d9d9d9;
    }
  </style>
</head>
<body>
<header><h1>Open-Scale PLUs</h1></header>

<main>
  <section id="nextPluBox" class="input-group">
    <strong>Next open PLU:</strong>
    <span id="nextPlu" style="font-size:1.4rem;"></span>
    <button id="refreshBtn" class="secondary" style="margin-left:1rem;">Refresh</button>
  </section>

  <hr />

  <section class="input-group">
    <label for="qty">Need more than one?</label>
    <div class="flex" style="align-items:flex-end;">
      <input type="number" id="qty" min="1" max="100" value="5" style="max-width:90px;" />
      <button id="getBtn">Get PLUs</button>
    </div>
  </section>

  <ul id="pluList" style="margin-top:1rem;"></ul>
</main>

<script>
	// -----------------------------------------------------
// helper: 4‑digit PLU  →  13‑digit “scale” UPC
// pattern is  00 20 <PLU> 00000   → 13 digits
function pluToUPC(plu){
  return `0020${plu.padStart(4,'0')}00000`;
}
	
async function loadNextPlu() {
  const box = document.getElementById('nextPlu');
  box.textContent = '…';
  const res  = await fetch('/api/open-scale-plu?count=5');
  const data = await res.json();
  const p = data.free?.[0];
  box.textContent = p ? `${p}  –  ${pluToUPC(p)}` : 'not available';
}

async function fetchMany(n){
  const list = document.getElementById('pluList');
  list.innerHTML = 'Loading…';
  const res  = await fetch(`/api/open-scale-plu?count=${n}`);
  const { free } = await res.json();
  list.innerHTML = free?.length
  	? free.map(p => `<li><code>${p}</code> – <code>${pluToUPC(p)}</code></li>`).join('')
  	: '<li>No free PLUs found.</li>';
}

document.getElementById('refreshBtn').onclick = () => { fetchMany(5); loadNextPlu(); };
document.getElementById('getBtn').onclick     = () => {
  const n = Math.max(1, parseInt(document.getElementById('qty').value,10)||1);
  fetchMany(n);
  loadNextPlu();
};

loadNextPlu();   // initial paint
fetchMany(5);
</script>
<script src="https://item-list-handler.onrender.com/shared/nav.js?v=1.0.0"></script>
</body>
</html>
