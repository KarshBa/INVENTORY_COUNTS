<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lists</title>
  <link rel="stylesheet" href="/styles.css"/>
  </head>
  <style>
  /* ===== mobile tweaks – imitate user.html ===== */
  @media (min-width:601px){
    .container{          /* the <main class="container"> wrapper */
      max-width:1000px;  /* ⬅️ cap width */
      margin:0 auto;     /* centre it */
    }
  }
  /* desktop: keep full table */
  @media (min-width:601px){
    #shrink-table thead th,
    #shrink-table tbody td{ padding:.6rem; }
  }
  /* mobile: narrower cells + horizontal scroll */
  @media (max-width:600px){
    #shrink-table{
      min-width:600px;        /* let the user scroll sideways      */
      font-size:.9rem;        /* shrink text a little               */
    }
    #shrink-table thead th,
    #shrink-table tbody td{
      padding:.4rem .3rem;
      white-space:nowrap;
    }
  }
    /* --- make every trash-can button red --- */
    button.del{
      background: var(--danger);   /* #d93025 from styles.css */
      color:#fff;
    }
    button.del:hover{ background:#b72018; }
    button.danger{background:var(--danger);}
    button.danger:hover{background:#b72018;}
    /* ――― prevent wrapping + allow sideways scroll if still too long ――― */
.nowrap {
  display: flex;
  gap: .5rem;
  flex-wrap: nowrap !important;   /* override .flex {flex-wrap:wrap} */
  overflow-x: auto;               /* phone: tiny horizontal scroll   */
}
</style>
<body>
  <!-- ⭐ NEW header bar – full-width, centred text ⭐ -->
<header style="background:#8ad4b2;padding:1rem;text-align:center;">
  <h1 style="margin:0;">Lists</h1>
</header>
  <!-- keep everything else inside the container -->
  <main class="container">
    <!-- list selector / creator + actions in one row -->
<div class="card nowrap-row">
  <!-- LEFT side -------------------------------------------------->
  <div style="flex:1;min-width:190px">
    <label for="listSelect">Choose list</label>
    <select id="listSelect"></select>
  </div>

  <div style="flex:1;min-width:190px">
    <label for="newList">List name</label>
    <input type="text" id="newList" placeholder="New list name">
  </div>

  <button id="createBtn">Create List</button>

  <!-- RIGHT side  (auto-pushes to far right) -------------------->
  <div
  style="
    margin-left:auto;
    display:flex;
    gap:.5rem;
   flex-wrap:nowrap;          /* <- NEW: keep on one line   */
   overflow-x:auto;           /*    scroll if still too wide */
  ">
  <button id="exportBtn">Export</button>
  <button id="exportAllBtn">Export ALL</button>
  <button id="delListBtn" class="danger">Delete</button>
</div>
</div>

    <!-- scanner + feedback -->
    <div class="card">
      <label for="scan">Item Code</label>
      <input type="text" id="scan" inputmode="numeric" autofocus/>
      <p id="warn" class="hidden" style="color:#cc0000;font-weight:bold;">
    Item does not exist
  </p>
    </div>

    <!-- list table -->
    <div class="card" style="overflow-x:auto;">
      <table id="shrink-table" width="100%">
        <thead>
          <tr>
            <th>Item Code</th><th>Brand</th><th class="description">Description</th>
            <th>Sub‑Dept</th><th class="del-col">🗑️</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    
  <script type="module" src="/js/simplelist.js"></script>
</main>
</body>
</html>
